# Supabase PostgreSQL Connection
spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Odds API Configuration
odds.api.key=${ODDS_API_KEY}
odds.api.base-url=https://api.the-odds-api.com/v4/sports
# CollegeFootballData API Configuration
cfbd.api.key=${CFBD_API_KEY}

# Google OAuth2 Credentials
# Google OAuth2 Credentials loaded from .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}